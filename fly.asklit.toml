app = "asklit-chat"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.asklit"
  [build.args]
    NEXT_PUBLIC_ASKLIT_API_URL = "https://asklit-studio.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/asklit"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
