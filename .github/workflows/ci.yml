name: Build Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Tests
      run: npm test
        
    - name: Build the project with catalog fixtures
      run: npm run build
      env:
        CI_CATALOG_FIXTURES: '1'
        NODE_OPTIONS: '--require ./scripts/ci-catalog-fetch.cjs'
        NEXT_PUBLIC_SPOT_API_BEARER_TOKEN: ${{ secrets.NEXT_PUBLIC_SPOT_API_BEARER_TOKEN }}
